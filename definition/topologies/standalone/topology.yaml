# Standalone topology definition: a single MariaDB node with no HA.
# This is the MVP/Phase 1 topology — simple, lowest operational risk.

config:
  components:
    engine:
      defaults:
        replicas: 1
      supportedFields:
        properties:
          storage: {}
          resources: {}
          replicas: {}
          service: {}
          schedulingPolicy:
            # schedulerName has no MariaDB operator counterpart.
            properties:
              affinity: {}
              nodeSelector: {}
              tolerations: {}
              topologySpreadConstraints: {}

ui:
  sections:
    databaseVersion:
      label: "Database Version"
      description: "Select the MariaDB version to deploy."
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: "Database Version"
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: "name"
              valuePath: "name"
            modes:
              edit:
                disabled: true
              restore:
                disabled: true
          validation:
            required: true

    resources:
      label: "Resources"
      description: "Configure the CPU, memory, and storage for your MariaDB node."
      components:
        nodes:
          uiType: group
          components:
            numberOfNodes:
              path: "spec.components.engine.replicas"
              uiType: number
              fieldParams:
                label: "Number of nodes"
                defaultValue: 1
                helperText: "Standalone runs a single node. Use the Galera topology for a multi-node HA cluster."
              validation:
                required: true
                min: 1
                max: 1
                int: true
                celExpressions:
                  - celExpr: "spec.components.engine.replicas == 1"
                    message: "Standalone topology supports a single node only; use the Galera topology for multiple nodes"

            resources:
              uiType: group
              groupType: line
              components:
                cpu:
                  path: "spec.components.engine.resources.limits.cpu"
                  uiType: number
                  fieldParams:
                    label: "CPU"
                    defaultValue: 1
                    step: 1
                  validation:
                    min: 0.5
                    required: true
                memory:
                  path: "spec.components.engine.resources.limits.memory"
                  uiType: number
                  fieldParams:
                    label: "Memory"
                    defaultValue: 2
                    step: 0.5
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 0.5
                    required: true
                disk:
                  path: "spec.components.engine.storage.size"
                  uiType: number
                  fieldParams:
                    label: "Disk"
                    defaultValue: 10
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 1
                    int: true
                    required: true
                    modes:
                      edit:
                        celExpressions:
                          - celExpr: "spec.components.engine.storage.size >= original.spec.components.engine.storage.size"
                            message: "Disk size cannot be decreased"
          componentsOrder:
            - numberOfNodes
            - resources

    security:
      label: "TLS"
      description: "Encrypt client connections and choose the server certificate."
      components:
        mode:
          uiType: select
          path: spec.parameters.tls.mode
          fieldParams:
            label: "TLS mode"
            helperText: "Required rejects clients that do not use TLS, at MariaDB and MaxScale; enable it once all clients trust the CA of the connection secret. Changing the mode restarts the pods one at a time. TLS can't be turned off after the instance is created."
            defaultValue: "preferTLS"
            options:
              - label: "Preferred: clients choose whether to use TLS"
                value: "preferTLS"
              - label: "Required: clients must use TLS"
                value: "requireTLS"
              - label: "Disabled"
                value: "disabled"
        certificates:
          uiType: group
          groupType: bordered
          label: "Certificates"
          description: "Leave empty to have the mariadb-operator issue the server certificate from a CA it creates for the instance. Clients verify the server with the CA certificate the connection secret holds as ca.crt. Can't be changed while TLS is on."
          components:
            issuer:
              uiType: group
              groupType: line
              components:
                issuerName:
                  uiType: text
                  path: spec.parameters.tls.issuer.name
                  fieldParams:
                    label: "cert-manager issuer"
                    helperText: "Issuer that signs the server certificate. It must write its CA certificate (ca.crt), as CA and Vault issuers do. Needs cert-manager."
                    modes:
                      edit:
                        disabled: true
                  validation:
                    celExpressions:
                      - celExpr: "!has(spec.parameters) || !has(spec.parameters.tls) || !has(spec.parameters.tls.issuer) || !has(spec.parameters.tls.issuer.name) || spec.parameters.tls.issuer.name == '' || !has(spec.parameters.tls.certificateSecretName) || spec.parameters.tls.certificateSecretName == ''"
                        message: "Use either an issuer or a certificate secret, not both"
                      - celExpr: "!has(spec.parameters) || !has(spec.parameters.tls) || !has(spec.parameters.tls.issuer) || !has(spec.parameters.tls.issuer.kind) || spec.parameters.tls.issuer.kind == '' || (has(spec.parameters.tls.issuer.name) && spec.parameters.tls.issuer.name != '')"
                        message: "Name the issuer"
                issuerKind:
                  uiType: select
                  path: spec.parameters.tls.issuer.kind
                  fieldParams:
                    label: "Issuer kind"
                    helperText: "Issuer when not set"
                    options:
                      - label: "Issuer"
                        value: "Issuer"
                      - label: "ClusterIssuer"
                        value: "ClusterIssuer"
                    modes:
                      edit:
                        disabled: true
              componentsOrder:
                - issuerName
                - issuerKind
            certificateSecretName:
              uiType: text
              path: spec.parameters.tls.certificateSecretName
              fieldParams:
                label: "Certificate secret"
                helperText: "Secret with the server certificate and any intermediate CA certificates (tls.crt), its key (tls.key) and the CA certificate (ca.crt). The certificate must be valid for the instance's Service (<name>.<namespace>.svc)."
                modes:
                  edit:
                    disabled: true
              validation:
                regex:
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
                  message: "Must be a valid Kubernetes object name (lowercase letters, digits, '-' and '.')"
          componentsOrder:
            - issuer
            - certificateSecretName
      componentsOrder:
        - mode
        - certificates

    advanced:
      label: "Advanced configuration"
      description: "Configure storage class and optional MariaDB settings."
      components:
        storageClass:
          uiType: select
          path: spec.components.engine.storage.storageClass
          fieldParams:
            label: "Storage class"
            modes:
              edit:
                disabled: true
          dataSource:
            provider: storageClasses
        externalAccess:
          uiType: select
          path: spec.components.engine.service.serviceType
          fieldParams:
            label: "External access"
            defaultValue: "ClusterIP"
            options:
              - label: "ClusterIP"
                value: "ClusterIP"
              - label: "LoadBalancer"
                value: "LoadBalancer"
              - label: "NodePort"
                value: "NodePort"
        configuration:
          uiType: text
          path: spec.components.engine.parameters.configuration
          fieldParams:
            label: "Engine configuration (my.cnf)"
            placeholder: |
              [mariadb]
              max_connections=100
            multiline: true
            minRows: 3
            maxRows: 8
        podSchedulingPolicy:
          uiType: group
          groupType: bordered
          label: "Pod scheduling policy"
          components:
            policy:
              uiType: widget
              widgetType: podSchedulingPolicy
      componentsOrder:
        - storageClass
        - externalAccess
        - configuration
        - podSchedulingPolicy

  sectionsOrder:
    - databaseVersion
    - resources
    - security
    - advanced
