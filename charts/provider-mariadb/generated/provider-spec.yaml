                        badgeToApi: true
                        defaultValue: 2
                        label: Memory
                        step: 0.5
                      path: spec.components.engine.resources.limits.memory
                      uiType: number
                      validation:
                        min: 0.5
                        required: true
                  groupType: line
                  uiType: group
              componentsOrder:
                - numberOfNodes
                - resources
              uiType: group
          description: Configure the CPU, memory, and storage for your MariaDB node.
          label: Resources
        security:
          components:
