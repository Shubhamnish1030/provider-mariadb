          version: 0.15.1
  components:
    engine:
      parametersSchema:
        openAPIV3Schema:
          description: MariadbParameters defines optional per-component parameters for MariaDB engine nodes.
          properties:
            bootstrap:
              description: Bootstrap configures where a new instance's data comes from.
              properties:
                volumeSnapshot:
                  description: |-
                    VolumeSnapshot starts the instance from a VolumeSnapshot of another
                    instance's data volume, in the same namespace. The snapshot must be
                    annotated provider-mariadb.openeverest.io/bootstrap-instance with this
                    instance's name. Only read when the instance is created.
                  properties:
                    name:
                      description: Name of the VolumeSnapshot.
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
              type: object
            configuration:
              description: |-
                Configuration is additional MariaDB configuration appended to the default my.cnf.
                `configuration` is the conventional engine-config property name across providers;
                the content is passed verbatim to the operator's spec.myCnf field.
              type: string
          type: object
      type: mariadb
    proxy:
      parametersSchema:
        openAPIV3Schema:
          description: |-
            MaxScaleParameters defines parameters for the proxy component.

            The proxy component deploys MariaDB MaxScale in front of a Galera or
            replication cluster. MaxScale routes writes to the primary and balances reads
            across replicas; primary failover stays with the mariadb-operator.
            Client connection details point at MaxScale while it is enabled.
          properties:
            enabled:
              description: |-
                Enabled deploys MaxScale in front of the cluster. Only supported on the
                galera and replication topologies. Defaults to false.
              enum:
                - true
                - false
                - "true"
                - "false"
          type: object
      type: maxscale
  defaultVersion: "12.3"
  monitoring:
    componentTypes:
      mariadb:
        metrics: Exporter
  parametersSchema:
    openAPIV3Schema:
      description: |-
        Parameters defines instance-wide structured parameters that apply to the
        entire cluster (Instance.spec.parameters).
      properties:
        tls:
          description: |-
            TLS configures encryption in transit: between clients and MariaDB,
            between the replicas, and between Galera nodes.
          properties:
            additionalNames:
              description: |-
                AdditionalNames are DNS names the server certificate is valid for
                besides those of the instance's Services and pods, such as an external
                name clients connect to. Used with issuer or the operator's CA; cannot
                be combined with certificateSecretName, whose certificate carries its
                own names. Changing them on a running instance reissues the
                certificate and restarts the pods, so it waits for maintenance
                approval.
              items:
                type: string
              type: array
            certificateSecretName:
              description: |-
                CertificateSecretName names a Secret in the instance namespace with the
                server certificate, followed by any intermediate CA certificates
                (tls.crt), its private key (tls.key) and the CA certificate it is
                verified with (ca.crt). The certificate must be valid for the names of
                the instance's Services and, for galera and replication, of its pods
                (*.<instance>-internal.<namespace>.svc.cluster.local), as well as for
                the names clients connect to. Does not need cert-manager. Cannot be
                combined with issuer or additionalNames.
              type: string
            galeraSSTEnabled:
              description: |-
                GaleraSSTEnabled encrypts Galera state snapshot transfers. Defaults to
                true on the galera topology; ignored on the others.
              enum:
                - true
                - false
                - "true"
                - "false"
            issuer:
              description: |-
                Issuer is the cert-manager issuer that signs the server certificate,
                instead of the CA the mariadb-operator creates. The operator requests
                it as the Certificate <instance>-server-cert and cert-manager renews
                it. The issuer must write its CA certificate to ca.crt, as the CA and
                Vault issuers do.
              properties:
                group:
                  default: cert-manager.io
                  description: |-
                    Group is the API group of an external issuer, such as
                    awspca.cert-manager.io.
                  type: string
                kind:
                  default: Issuer
                  description: |-
                    Kind of the issuer: Issuer or ClusterIssuer, or the kind of an
                    external issuer of group.
                  type: string
                name:
                  description: Name of the issuer.
                  type: string
              required:
                - name
              type: object
            mode:
              default: preferTLS
              description: |-
                Mode is disabled, preferTLS or requireTLS. Changing it restarts the
                pods, one at a time. TLS cannot be turned off on an existing instance.
              type: string
          type: object
      type: object
