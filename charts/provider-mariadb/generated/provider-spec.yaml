                - certificateSecretName
              description: Leave empty to have the mariadb-operator issue the server certificate from a CA it creates for the instance. Clients verify the server with the CA certificate the connection secret holds as ca.crt. Can't be changed while TLS is on.
              groupType: bordered
              label: Certificates
              uiType: group
            mode:
              fieldParams:
                defaultValue: preferTLS
                helperText: Required rejects clients that do not use TLS, at MariaDB and MaxScale; enable it once all clients trust the CA of the connection secret. Changing the mode restarts the pods one at a time. TLS can't be turned off after the instance is created.
                label: TLS mode
                options:
                  - label: 'Preferred: clients choose whether to use TLS'
                    value: preferTLS
                  - label: 'Required: clients must use TLS'
                    value: requireTLS
                  - label: Disabled
                    value: disabled
