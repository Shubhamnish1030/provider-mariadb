apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: test-instance-monitoring
spec:
  (metrics.enabled != `true`): true
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance-monitoring
status:
  (conditions[?type == 'Ready'].status | [0]): "True"
  (length(monitoring.sources.metrics || `[]`)): 0
