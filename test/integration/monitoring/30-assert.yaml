# The exporter runs again and its endpoints are published for the scraper,
# with no destination listed.
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: test-instance-monitoring
spec:
  metrics:
    enabled: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-instance-monitoring-metrics
status:
  readyReplicas: 1
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance-monitoring
status:
  (conditions[?type == 'Ready'].status | [0]): "True"
  monitoring:
    (destinations == null): true
    (length(sources.metrics || `[]`)): 1
